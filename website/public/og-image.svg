<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#18181b"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow effects -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="900" cy="450" rx="350" ry="250" fill="url(#glow2)"/>

  <!-- Logo -->
  <rect x="540" y="180" width="120" height="120" rx="24" fill="url(#iconGrad)"/>
  <path d="M600 220 L560 245 L560 285 L600 310 L640 285 L640 245 Z" stroke="white" stroke-width="4" fill="none"/>
  <path d="M600 255 L580 267 L580 279 L600 291 L620 279 L620 267 Z" fill="white"/>

  <!-- Title -->
  <text x="600" y="380" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle">@oxog/bundler</text>

  <!-- Subtitle -->
  <text x="600" y="440" font-family="Inter, sans-serif" font-size="32" fill="url(#textGrad)" text-anchor="middle">Zero-Config JavaScript Bundler</text>

  <!-- Features -->
  <text x="600" y="510" font-family="Inter, sans-serif" font-size="22" fill="#71717a" text-anchor="middle">Tree Shaking • Code Splitting • ESM/CJS/IIFE • TypeScript</text>

  <!-- URL -->
  <text x="600" y="580" font-family="JetBrains Mono, monospace" font-size="18" fill="#52525b" text-anchor="middle">bundler.oxog.dev</text>
</svg>
